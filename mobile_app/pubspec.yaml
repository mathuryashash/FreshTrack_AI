name: freshtrack_mobile
description: FreshTrack AI — on-device produce freshness check (ONNX Runtime, offline).
publish_to: 'none'
version: 2.0.1+3

environment:
  sdk: '>=3.10.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Image capture (camera + gallery via the system pickers)
  image_picker: ^1.2.0

  # On-device inference: ONNX Runtime + pure-Dart decode/EXIF for preprocessing
  flutter_onnxruntime: ^1.8.5
  image: ^4.10.1

  # Local database (prediction history)
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2

  # UI
  flutter_spinkit: ^5.2.0
  percent_indicator: ^4.2.3

  # State & utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/model/
